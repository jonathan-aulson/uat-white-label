name: Check and deploy demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://uat-demo.jonathan-aulson-80b.workers.dev
    concurrency:
      group: uat-demo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main push exists; this superseded commit will not deploy."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.latest.outputs.current == 'true'
        run: npm ci
      - name: Apply additive database migrations and deploy demo
        if: steps.latest.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply uat-demo --remote --config wrangler.demo.jsonc
          npx wrangler deploy --config wrangler.demo.jsonc
      - name: Verify demo is open without sign-in
        if: steps.latest.outputs.current == 'true'
        run: |
          for endpoint in participants admin/documents; do
            file="$(echo "$endpoint" | tr / -).json"
            status="$(curl --fail --silent --show-error --max-time 30 --output "$file" \
              --write-out '%{http_code}' "https://uat-demo.jonathan-aulson-80b.workers.dev/api/$endpoint")"
            test "$status" = "200"
          done
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const participants = JSON.parse(readFileSync('participants.json', 'utf8'));
          const documents = JSON.parse(readFileSync('admin-documents.json', 'utf8'));
          assert.equal(participants.openAccess, true);
          assert.equal(participants.selectedId, null);
          assert.deepEqual(Object.keys(participants).sort(), ['openAccess', 'participants', 'selectedId', 'selectionError', 'workspace']);
          assert(Array.isArray(participants.participants));
          for (const person of participants.participants) assert.deepEqual(Object.keys(person).sort(), ['id', 'label']);
          assert.deepEqual(Object.keys(documents).sort(), ['documents', 'enabled', 'limits']);
          assert(Array.isArray(documents.documents));
          function checkKeys(value) {
            if (!value || typeof value !== 'object') return;
            for (const [key, nested] of Object.entries(value)) {
              assert(!/(?:^|_)(token|secret|password|pat)(?:$|_)/i.test(key), `Unexpected secret field: ${key}`);
              checkKeys(nested);
            }
          }
          checkKeys(participants); checkKeys(documents);
          JS
